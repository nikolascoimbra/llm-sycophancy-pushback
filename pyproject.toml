[project]
name = "sycophancy-study"
version = "0.1.0"
description = "Cross-laboratory measurement of LLM sycophancy under user-correction pressure."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Nikolas Janke" },
]
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5",
    "ruff>=0.4",
]
inference = [
    "boto3>=1.34",
    "openai>=1.30",
    "anthropic>=0.40",
    "google-genai>=2.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sycophancy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
